name: Download and self-host food photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-food-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache-food-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download curated Unsplash imagery into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          download() {
            local name="$1" url="$2"
            curl --fail --location --retry 3 --silent --show-error --max-time 50 "$url" -o "assets/$name"
            test "$(wc -c < "assets/$name")" -gt 15000
            file "assets/$name"
          }
          download "biryani-hero.jpg" "https://images.unsplash.com/photo-1563379091339-03246963d7d3?auto=format&fit=crop&w=1800&q=80"
          download "biryani-table.jpg" "https://images.unsplash.com/photo-1631515242808-497c3fbd3972?auto=format&fit=crop&w=1000&q=75"
          download "biryani-chicken.jpg" "https://images.unsplash.com/photo-1631515243349-e0cb75fb8d3a?auto=format&fit=crop&w=1000&q=75"
          download "biryani-dark.jpg" "https://images.unsplash.com/photo-1559528896-c5310744cce8?auto=format&fit=crop&w=1000&q=75"
          download "biryani-celebration.jpg" "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?auto=format&fit=crop&w=1000&q=75"
      - name: Commit website images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Host restaurant food photos in repository"
            git push
          fi
